<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAY Mining | TON Network</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 15px 15px 25px 15px;
        }

        @keyframes neonPulse {
            0% {
                border-color: #00d2ff;
                box-shadow: 0 0 10px rgba(0, 210, 255, 0.4), inset 0 0 10px rgba(0, 210, 255, 0.2);
            }
            50% {
                border-color: #9d00ff;
                box-shadow: 0 0 25px rgba(157, 0, 255, 0.6), inset 0 0 15px rgba(157, 0, 255, 0.3);
            }
            100% {
                border-color: #00d2ff;
                box-shadow: 0 0 10px rgba(0, 210, 255, 0.4), inset 0 0 10px rgba(0, 210, 255, 0.2);
            }
        }

        @keyframes btnNeonGlow {
            0% {
                background: linear-gradient(135deg, #0088cc, #00d2ff);
                box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            }
            50% {
                background: linear-gradient(135deg, #7928ca, #ff007f);
                box-shadow: 0 4px 25px rgba(255, 0, 127, 0.6);
            }
            100% {
                background: linear-gradient(135deg, #0088cc, #00d2ff);
                box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            }
        }

        .top-bar {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tg-profile {
            background: rgba(18, 24, 38, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.4);
            padding: 4px 10px 4px 5px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: neonPulse 4s infinite;
            max-width: 145px;
            flex-shrink: 0;
        }
        .tg-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #00d2ff;
            background-color: #1e293b;
        }
        .tg-name {
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #ton-connect {
            flex-shrink: 0;
        }
        #ton-connect > div {
            transform: scale(0.85);
            transform-origin: right center;
        }

        .container {
            text-align: center;
            background: rgba(18, 24, 38, 0.85);
            padding: 22px 18px;
            border-radius: 20px;
            border: 2px solid #00d2ff;
            animation: neonPulse 5s infinite;
            max-width: 380px;
            width: 100%;
            position: relative;
        }

        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        .balance-box {
            margin-bottom: 15px;
        }
        .balance-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .balance-amount {
            font-size: 26px;
            font-weight: 800;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            margin-top: 4px;
        }

        .coin-wrapper {
            position: relative;
            width: 175px;
            height: 175px;
            margin: 10px auto 18px auto;
            border-radius: 50%;
            padding: 5px;
            border: 3px solid #00d2ff;
            animation: neonPulse 3s infinite;
            cursor: pointer;
            transition: transform 0.08s ease;
        }
        .coin-wrapper:active {
            transform: scale(0.93);
        }
        .coin-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
        }

        .floating-plus {
            position: absolute;
            color: #00ffcc;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.8);
            animation: floatUp 0.9s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
        }

        .energy-section {
            margin-bottom: 12px;
        }
        .energy-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(11, 15, 25, 0.8);
            border-radius: 10px;
            border: 1px solid rgba(0, 210, 255, 0.4);
            overflow: hidden;
        }
        .energy-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00d2ff, #9d00ff);
            transition: width 0.2s ease;
        }

        .status-text {
            font-size: 12px;
            color: #00ffcc;
            min-height: 16px;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #00d2ff;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
        }
        .boost-card {
            background: rgba(11, 15, 25, 0.75);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            animation: neonPulse 4s infinite;
        }
        .boost-info h3 {
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .boost-info p {
            font-size: 11px;
            color: #94a3b8;
        }
        .buy-ton-btn {
            animation: btnNeonGlow 5s infinite;
            border: none;
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .buy-ton-btn:active {
            transform: scale(0.95);
        }

        .profile-list {
            background: rgba(11, 15, 25, 0.75);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 14px;
            padding: 12px 15px;
            margin-bottom: 15px;
            text-align: left;
        }
        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
        }
        .profile-row:last-child {
            border-bottom: none;
        }
        .profile-key {
            color: #94a3b8;
        }
        .profile-val {
            color: #ffffff;
            font-weight: 600;
        }

        .nav-boxes {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            border-top: 1px solid rgba(0, 210, 255, 0.2);
            padding-top: 15px;
            margin-top: 10px;
        }
        .nav-box {
            flex: 1;
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            padding: 11px 4px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            animation: neonPulse 4s infinite;
        }
        .nav-box.active-tab {
            background: rgba(0, 210, 255, 0.25);
            border-color: #ff007f;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="tg-profile">
            <img id="tg-avatar" class="tg-avatar" src="1793244950894.jpg" alt="Avatar">
            <span id="tg-name" class="tg-name">@Leslav</span>
        </div>
        <div id="ton-connect"></div>
    </div>

    <div class="container">
        
        <!-- ВКЛАДКА 1: МАЙНІНГ -->
        <div id="view-mine" class="view-section active">
            <div class="balance-box">
                <div class="balance-label">Намайнено RAY</div>
                <div class="balance-amount" id="balance">0.0000000
