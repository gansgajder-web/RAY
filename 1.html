<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAY</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0b10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            padding: 16px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .user-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(147, 51, 234, 0.3);
            border-radius: 20px;
            padding: 5px 12px 5px 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .avatar-ph {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #4a1d96;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .wallet-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(147, 51, 234, 0.3);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 13px;
            color: #ccc;
        }
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 0 4px;
        }
        .screen-content {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
        }
        .screen-content.active {
            display: flex;
        }
        .main-card {
            background: linear-gradient(145deg, #12101f, #1b162c);
            border: 1px solid rgba(147, 51, 234, 0.4);
            border-radius: 24px;
            padding: 24px 16px;
            text-align: center;
            margin: auto 0;
            box-shadow: 0 0 35px rgba(147, 51, 234, 0.15);
        }
        .mining-title {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .balance-amount {
            font-size: 26px;
            font-weight: bold;
            color: #34d399;
            margin-bottom: 24px;
            text-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
            word-break: break-all;
        }
        .coin-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 24px auto;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.25) 0%, rgba(18, 16, 31, 0) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid rgba(147, 51, 234, 0.6);
            box-shadow: 0 0 30px rgba(147, 51, 234, 0.35);
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease;
        }
        .coin-container:active {
            transform: scale(0.94);
        }
        .coin-inner-icon {
            font-size: 42px;
            color: #fff;
            font-weight: bold;
        }
        .save-btn {
            background: linear-gradient(135deg, #0d9488, #0f766e);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(13, 148, 136, 0.3);
            margin-top: 10px;
        }
        .save-btn:active {
            opacity: 0.85;
        }
        .section-card {
            background: linear-gradient(145deg, #12101f, #1b162c);
            border: 1px solid rgba(147, 51, 234, 0.4);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            margin: auto 0;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 12px;
        }
        .section-desc {
            font-size: 14px;
            color: #9ca3af;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(27, 22, 44, 0.9);
            border: 1px solid rgba(147, 51, 234, 0.3);
            padding: 12px 0;
            border-radius: 16px;
            margin-top: 20px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #9ca3af;
            text-decoration: none;
            gap: 4px;
            cursor: pointer;
            background: transparent;
            border: none;
        }
        .nav-item.active {
            color: #34d399;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 1000;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: #1b162c;
            border: 1px solid rgba(147, 51, 234, 0.5);
            padding: 24px 20px;
            border-radius: 20px;
            width: 85%;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }
        .modal-text {
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .modal-btn {
            background: transparent;
            color: #38bdf8;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: right;
            padding-right: 10px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="user-tag">
            <div class="avatar-ph">👑</div>
            <span>@Leslav</span>
        </div>
        <div class="wallet-badge">UQDX...RtWw ⌄</div>
    </div>

    <div class="header-nav">
        <span>✕</span>
        <span>RAY</span>
        <span>⋮</span>
    </div>

    <!-- Вкладка 1: Головна -->
    <div class="screen-content active" id="screen-home">
        <div class="main-card">
            <div class="mining-title">НАМАЙНЕНО RAY</div>
            <div class="balance-amount" id="balanceDisplay">0.0000000021</div>
            
            <div class="coin-container" id="coinButton">
                <div class="coin-inner-icon">▲</div>
            </div>

            <button class="save-btn" id="saveBtn">
                <span>💾</span> Зберегти прогрес
            </button>
        </div>
    </div>

    <!-- Вкладка 2: Буст -->
    <div class="screen-content" id="screen-boost">
        <div class="section-card">
            <div class="section-title">Прискорювач майнінгу</div>
            <div class="section-desc">Скоро буде доступно підвищення швидкості майнінгу RAY.</div>
        </div>
    </div>

    <!-- Вкладка 3: Профіль -->
    <div class="screen-content" id="screen-profile">
        <div class="section-card">
            <div class="section-title">Профіль користувача</div>
            <div class="section-desc">Акаунт: @Leslav<br>Гаманець: UQDX...RtWw</div>
        </div>
    </div>

    <!-- Нижня навігація -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('home', this)">
            <span>🔥</span>Головна
        </button>
        <button class="nav-item" onclick="switchTab('boost', this)">
            <span>⚡</span>Буст
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <span>👤</span>Профіль
        </button>
    </div>

    <!-- Модальне вікно збереження -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title">RAY</div>
            <div class="modal-text" id="modalText">Прогрес успішно збережено в хмарі!</div>
            <button class="modal-btn" id="modalClose">Гаразд</button>
        </div>
    </div>

    <script>
        let rayData = {
            balance: 0.0000000021,
            speed: 0.0000000001,
            lastTime: Date.now()
        };

        const balanceDisplay = document.getElementById('balanceDisplay');
        const coinButton = document.getElementById('coinButton');
        const saveBtn = document.getElementById('saveBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalText = document.getElementById('modalText');
        const modalClose = document.getElementById('modalClose');

        function updateDisplay() {
            balanceDisplay.innerText = rayData.balance.toFixed(10);
        }

        function showPopup(text) {
            modalText.innerText = text;
            modalOverlay.classList.add('show');
        }

        modalClose.addEventListener('click', () => {
            modalOverlay.classList.remove('show');
        });

        function switchTab(tabName, element) {
            document.querySelectorAll('.screen-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById('screen- ' + tabName).classList.add('active'); // Зверніть увагу на ідентифікатори нижче
            // Виправлений виклик нижче через фікс рядка:
            document.getElementById('screen-' + tabName).classList.add('active');
            element.classList.add('active');
        }

        function loadRayData() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage) {
                window.Telegram.WebApp.CloudStorage.getItem('ray_cloud_save', (err, value) => {
                    if (!err && value) {
                        try {
                            const parsed = JSON.parse(value);
                            rayData.balance = parsed.balance ?? 0.0000000021;
                            rayData.speed = parsed.speed ?? 0.0000000001;

                            if (parsed.lastTime) {
                                const secondsPassed = (Date.now() - parsed.lastTime) / 1000;
                                if (secondsPassed > 0) {
                                    rayData.balance += secondsPassed * rayData.speed;
                                }
                            }
                            updateDisplay();
                        } catch (e) {
                            fallbackLoad();
                        }
                    } else {
                        fallbackLoad();
                    }
                });
            } else {
                fallbackLoad();
            }
        }

        function fallbackLoad() {
            const local = localStorage.getItem('ray_cloud_save');
            if (local) {
                try {
                    const parsed = JSON.parse(local);
                    rayData.balance = parsed.balance ?? rayData.balance;
                    updateDisplay();
                } catch (e) {}
            }
        }

        function saveRayData(showMsg = true) {
            rayData.lastTime = Date.now();
            const payload = JSON.stringify(rayData);

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage) {
                window.Telegram.WebApp.CloudStorage.setItem('ray_cloud_save', payload, (err, saved) => {
                    if (!err && saved) {
                        if (showMsg) showPopup("Прогрес успішно збережено в хмарі!");
                    } else {
                        localStorage.setItem('ray_cloud_save', payload);
                        if (showMsg) showPopup("Прогрес успішно збережено в хмарі!");
                    }
                });
            } else {
                localStorage.setItem('ray_cloud_save', payload);
                if (showMsg) showPopup("Прогрес успішно збережено в хмарі!");
            }
        }

        setInterval(() => {
            rayData.balance += rayData.speed;
            updateDisplay();
        }, 1000);

        setInterval(() => {
            saveRayData(false);
        }, 15000);

        coinButton.addEventListener('click', () => {
            rayData.balance += 0.0000000005;
            updateDisplay();
        });

        saveBtn.addEventListener('click', () => {
            saveRayData(true);
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            loadRayData();
        });

        window.addEventListener('beforeunload', () => {
            saveRayData(false);
        });
    </script>
</body>
</html>
