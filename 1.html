<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAY Mining | TON Network</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 15px 15px 25px 15px;
        }

        @keyframes neonPulse {
            0% {
                border-color: #00d2ff;
                box-shadow: 0 0 10px rgba(0, 210, 255, 0.4), inset 0 0 10px rgba(0, 210, 255, 0.2);
            }
            50% {
                border-color: #9d00ff;
                box-shadow: 0 0 25px rgba(157, 0, 255, 0.6), inset 0 0 15px rgba(157, 0, 255, 0.3);
            }
            100% {
                border-color: #00d2ff;
                box-shadow: 0 0 10px rgba(0, 210, 255, 0.4), inset 0 0 10px rgba(0, 210, 255, 0.2);
            }
        }

        .top-bar {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tg-profile {
            background: rgba(18, 24, 38, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.4);
            padding: 5px 12px 5px 6px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: neonPulse 4s infinite;
            max-width: 170px;
        }
        .tg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #00d2ff;
            background-color: #1e293b;
        }
        .tg-name {
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .back-btn {
            background: rgba(18, 24, 38, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: #00d2ff;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            animation: neonPulse 4s infinite;
        }

        .container {
            text-align: center;
            background: rgba(18, 24, 38, 0.85);
            padding: 25px 20px;
            border-radius: 20px;
            border: 2px solid #00d2ff;
            animation: neonPulse 5s infinite;
            max-width: 380px;
            width: 100%;
            position: relative;
        }

        .balance-box {
            margin-bottom: 20px;
        }
        .balance-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .balance-amount {
            font-size: 36px;
            font-weight: 800;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            margin-top: 4px;
        }

        /* Велика кнопка-монета для тапу */
        .coin-wrapper {
            position: relative;
            width: 190px;
            height: 190px;
            margin: 15px auto 25px auto;
            border-radius: 50%;
            padding: 6px;
            border: 3px solid #00d2ff;
            animation: neonPulse 3s infinite;
            cursor: pointer;
            transition: transform 0.08s ease;
        }
        .coin-wrapper:active {
            transform: scale(0.93);
        }
        .coin-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
        }

        /* Анімація вилітаючого числа +0.01 */
        .floating-plus {
            position: absolute;
            color: #00ffcc;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.8);
            animation: floatUp 0.9s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
        }

        /* Смужка енергії */
        .energy-section {
            margin-bottom: 18px;
        }
        .energy-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(11, 15, 25, 0.8);
            border-radius: 10px;
            border: 1px solid rgba(0, 210, 255, 0.4);
            overflow: hidden;
        }
        .energy-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00d2ff, #9d00ff);
            transition: width 0.2s ease;
        }

        .status-text {
            font-size: 12px;
            color: #64748b;
            min-height: 16px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="tg-profile">
            <img id="tg-avatar" class="tg-avatar" src="1793244950894.jpg" alt="Avatar">
            <span id="tg-name" class="tg-name">Гість</span>
        </div>
        <a href="index.html" class="back-btn">← На головну</a>
    </div>

    <div class="container" id="mining-area">
        <div class="balance-box">
            <div class="balance-label">Намайнено RAY</div>
            <div class="balance-amount" id="balance">0.00</div>
        </div>

        <div class="coin-wrapper" id="tap-coin">
            <img src="1793244950894.jpg" alt="Mine RAY">
        </div>

        <div class="energy-section">
            <div class="energy-header">
                <span>⚡ Енергія</span>
                <span id="energy-text">500 / 500</span>
            </div>
            <div class="energy-bar-bg">
                <div class="energy-bar-fill" id="energy-fill"></div>
            </div>
        </div>

        <div class="status-text" id="sync-status">Синхронізація з базою...</div>
    </div>

    <script>
        // Підключення до вашої бази Supabase
        const SUPABASE_URL = 'https://ordlwuikqsvgyybuqtj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_rg7Z1F-ws8Y9zmUwDLXDVA_zpH6K8pw';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Ініціалізація Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const userId = user ? String(user.id) : 'guest_browser';
        const userName = user ? (user.username ? `@${user.username}` : user.first_name) : 'Гість';

        document.getElementById('tg-name').textContent = userName;
        if (user && user.photo_url) {
            document.getElementById('tg-avatar').src = user.photo_url;
        }

        // Параметри гри
        let balance = 0;
        let energy = 500;
        const maxEnergy = 500;
        const tapReward = 0.01;
        let saveTimeout = null;

        const balanceEl = document.getElementById('balance');
        const energyTextEl = document.getElementById('energy-text');
        const energyFillEl = document.getElementById('energy-fill');
        const syncStatusEl = document.getElementById('sync-status');
        const coinEl = document.getElementById('tap-coin');

        // Завантаження балансу з Supabase
        async function loadUserData() {
            const { data, error } = await supabaseClient
                .from('ray_mining')
                .select('balance')
                .eq('user_id', userId)
                .single();

            if (data) {
                balance = parseFloat(data.balance);
            } else {
                // Якщо новий гравець — створюємо запис
                await supabaseClient
                    .from('ray_mining')
                    .insert([{ user_id: userId, username: userName, balance: 0 }]);
            }
            updateUI();
            syncStatusEl.textContent = 'Збережено в хмарі ✓';
        }

        // Збереження балансу в Supabase (із затримкою 1.5 сек після останнього кліку)
        function scheduleSave() {
            syncStatusEl.textContent = 'Збереження...';
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                const { error } = await supabaseClient
                    .from('ray_mining')
                    .upsert({
                        user_id: userId,
                        username: userName,
                        balance: balance.toFixed(2),
                        updated_at: new Date().toISOString()
                    });
                
                syncStatusEl.textContent = error ? 'Помилка збереження' : 'Збережено в хмарі ✓';
            }, 1500);
        }

        function updateUI() {
            balanceEl.textContent = balance.toFixed(2);
            energyTextEl.textContent = `${energy} / ${maxEnergy}`;
            energyFillEl.style.width = `${(energy / maxEnergy) * 100}%`;
        }

        // Обробка натискання на монету
        coinEl.addEventListener('pointerdown', (e) => {
            if (energy <= 0) return;

            balance += tapReward;
            energy -= 1;
            updateUI();
            scheduleSave();

            // Вібрація в Telegram при тапі
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            // Вилітаючий текст +0.01
            const plus = document.createElement('div');
            plus.className = 'floating-plus';
            plus.textContent = `+${tapReward}`;
            const rect = coinEl.getBoundingClientRect();
            plus.style.left = `${e.clientX - rect.left - 15}px`;
            plus.style.top = `${e.clientY - rect.top - 15}px`;
            coinEl.appendChild(plus);

            setTimeout(() => plus.remove(), 900);
        });

        // Відновлення енергії (+2 щосекунди)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 2);
                updateUI();
            }
        }, 1000);

        loadUserData();
    </script>

</body>
</html>
