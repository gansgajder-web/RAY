<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAY Token | TON Network</title>
    <!-- Скрипт Telegram Web App для отримання ніку та аватарки -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Офіційна бібліотека TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        @keyframes neonPulse {
            0% {
                border-color: #00d2ff;
                box-shadow: 0 0 10px rgba(0, 210, 255, 0.4), inset 0 0 10px rgba(0, 210, 255, 0.2);
            }
            50% {
                border-color: #9d00ff;
                box-shadow: 0 0 25px rgba(157, 0, 255, 0.6), inset 0 0 15px rgba(157, 0, 255, 0.3);
            }
            100% {
                border-color: #00d2ff;
                box-shadow: 0 0 10px rgba(0, 210, 255, 0.4), inset 0 0 10px rgba(0, 210, 255, 0.2);
            }
        }

        @keyframes btnNeonGlow {
            0% {
                background: linear-gradient(135deg, #0088cc, #00d2ff);
                box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            }
            50% {
                background: linear-gradient(135deg, #7928ca, #ff007f);
                box-shadow: 0 4px 25px rgba(255, 0, 127, 0.6);
            }
            100% {
                background: linear-gradient(135deg, #0088cc, #00d2ff);
                box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            }
        }

        #ton-connect {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
        }

        /* Блок профілю Telegram угорі ліворуч */
        .tg-profile {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(18, 24, 38, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.4);
            padding: 5px 12px 5px 6px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: neonPulse 4s infinite;
            max-width: 170px;
        }
        .tg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #00d2ff;
            background-color: #1e293b;
            flex-shrink: 0;
        }
        .tg-name {
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .container {
            text-align: center;
            background: rgba(18, 24, 38, 0.85);
            padding: 30px 20px;
            border-radius: 20px;
            border: 2px solid #00d2ff;
            animation: neonPulse 5s infinite;
            max-width: 380px;
            width: 90%;
            margin-top: 40px;
        }
        .logo-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 15px auto;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #00d2ff;
            animation: neonPulse 3s infinite;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .btn {
            display: inline-block;
            animation: btnNeonGlow 6s infinite;
            color: #ffffff;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 30px;
            transition: transform 0.3s ease;
            margin-bottom: 20px;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .nav-boxes {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            border-top: 1px solid rgba(0, 210, 255, 0.2);
            padding-top: 18px;
        }
        .nav-box {
            flex: 1;
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            padding: 12px 5px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            animation: neonPulse 4s infinite;
        }
        .nav-box:hover {
            background: rgba(0, 210, 255, 0.25);
            border-color: #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Профіль користувача Telegram -->
    <div class="tg-profile">
        <img id="tg-avatar" class="tg-avatar" src="1793244950894.jpg" alt="Avatar">
        <span id="tg-name" class="tg-name">Гість</span>
    </div>

    <!-- Кнопка гаманця -->
    <div id="ton-connect"></div>

    <div class="container">
        <div class="logo-container">
            <img src="1793244950894.jpg" alt="RAY Token Logo">
        </div>
        <h1>RAY TOKEN</h1>
        <p>Офіційний токен проєкту в мережі TON. Швидкий, децентралізований та створений для майбутнього.</p>
        
        <a href="https://app.ston.fi/swap?ft=TON&tt=EQA_i0MM2zcBtmdJIlnroEIF7blopaJ7s7Jx95z2rvgRr3Y_" target="_blank" class="btn">Купити на STON.fi</a>

        <div class="nav-boxes">
            <a href="1.html" class="nav-box">⛏️ Майнінг</a>
            <a href="3.html" class="nav-box">💬 Чат</a>
            <a href="3.html" class="nav-box">🎮 Ігри</a>
        </div>
    </div>

    <script>
        // Отримання даних користувача з Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            const nameEl = document.getElementById('tg-name');
            const avatarEl = document.getElementById('tg-avatar');

            // Якщо є @username — ставимо його, інакше беремо ім'я
            nameEl.textContent = user.username ? `@${user.username}` : user.first_name;

            // Якщо у профілі відкрита аватарка — підтягуємо її
            if (user.photo_url) {
                avatarEl.src = user.photo_url;
            }
        }

        // Ініціалізація TON Connect
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://gansgajder-web.github.io/RAY/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });
    </script>

</body>
</html>
